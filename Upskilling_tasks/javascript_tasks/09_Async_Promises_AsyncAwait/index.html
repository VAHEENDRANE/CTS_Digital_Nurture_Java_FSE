<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 09 - Async, Promises &amp; Async/Await</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 09 - Async, Promises &amp; Async/Await</strong></p>
    <hr>

    <h2>Fetch Events from Mock API</h2>
    <p>
        <button onclick="fetchEventsWithThen()">Load Events using Promise (.then)</button>
        &nbsp;
        <button onclick="fetchEventsWithAsyncAwait()">Load Events using Async/Await</button>
        &nbsp;
        <button onclick="clearFeed()">Reset Feed</button>
    </p>

    <div id="loading-spinner" style="display: none; text-align: center; font-size: 18px;">Loading... ⏳</div>

    <div id="async-feed" style="border: 1px solid #ccc; padding: 10px; min-height: 80px;">
        <p><em>Click a button above to load events.</em></p>
    </div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>
    <p>
        <a href="../08_Event_Handling/index.html">← Previous: Event Handling</a>
        &nbsp;&nbsp;
        <a href="../10_Modern_JavaScript/index.html">Next: Modern JavaScript →</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
