<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 05 - Objects &amp; Prototypes</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 05 - Objects &amp; Prototypes</strong></p>
    <hr>

    <h2>Event Property Inspector</h2>

    <p>Select an event instance:
        <select id="event-selector" onchange="loadSelectedEventProperties()"></select>
    </p>

    <h3>Object Properties (via Object.entries)</h3>
    <table>
        <thead>
            <tr>
                <th>Property Key</th>
                <th>Property Value</th>
            </tr>
        </thead>
        <tbody id="entries-rows"></tbody>
    </table>

    <br>

    <div id="availability-banner" style="background: #d4edda; border: 1px solid #c3e6cb; padding: 10px;">
        <p id="availability-text">Click the button to check availability.</p>
        <button onclick="triggerAvailabilityCheck()">Run checkAvailability()</button>
    </div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>
    <p>
        <a href="../04_Functions_Closures_HigherOrderFunctions/index.html">← Previous: Functions</a>
        &nbsp;&nbsp;
        <a href="../06_Arrays_Methods/index.html">Next: Array Methods →</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
