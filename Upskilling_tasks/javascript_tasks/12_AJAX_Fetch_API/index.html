<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 12 - AJAX &amp; Fetch API</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 12 - AJAX &amp; Fetch API (HTTP POST)</strong></p>
    <hr>

    <h2>Send a Registration (HTTP POST)</h2>
    <p>
        Your Name: <input type="text" id="post-name" placeholder="Enter your name"><br><br>
        Select Event:
        <select id="post-event">
            <option>Music Festival</option>
            <option>Baking Workshop</option>
            <option>Yoga Camp</option>
            <option>Coding Bootcamp</option>
        </select><br><br>
        <button onclick="sendPostRegistration()">Send POST Request</button>
    </p>

    <div id="post-loader" style="display: none;">Sending... please wait ⏳</div>

    <div id="api-result-box" style="display: none; background: #f9f9f9; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; font-family: monospace; font-size: 13px;"></div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>

        <a href="../11_Working_With_Forms/index.html">← Previous: Working With Forms</a>
        &nbsp;&nbsp;
        <a href="../13_Debugging_Testing/index.html">Next: Debugging &amp; Testing →</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
