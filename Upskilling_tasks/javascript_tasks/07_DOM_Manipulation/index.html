<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 07 - DOM Manipulation</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 07 - DOM Manipulation</strong></p>
    <hr>

    <h2>Add Event to DOM</h2>
    <p>
        Event Name: <input type="text" id="dom-event-name" placeholder="Event Name"><br><br>
        Date: <input type="date" id="dom-event-date"><br><br>
        Category:
        <select id="dom-event-cat">
            <option value="Music">Music</option>
            <option value="Baking">Baking</option>
            <option value="Wellness">Wellness</option>
            <option value="Tech">Tech</option>
        </select><br><br>
        <button onclick="handleDOMSubmit()">Add to Page</button>
    </p>

    <hr>

    <h2>Events Added to DOM</h2>
    <div id="dynamic-events-grid"></div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>
    <p>
        <a href="../06_Arrays_Methods/index.html">← Previous: Array Methods</a>
        &nbsp;&nbsp;
        <a href="../08_Event_Handling/index.html">Next: Event Handling →</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
