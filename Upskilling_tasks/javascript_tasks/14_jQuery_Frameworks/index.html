<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 14 - jQuery &amp; Frameworks</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 14 - jQuery &amp; Frameworks</strong></p>
    <hr>

    <h2>jQuery Event Booking</h2>
    <p>
        <button id="showFormBtn">Show Booking Form</button>
    </p>

    <div id="booking-form-box" style="display: none; flex-direction: column; gap: 10px; border: 1px solid #ccc; padding: 15px;">
        <p>Name: <input type="text" id="jq-name" placeholder="Your name"></p>
        <p>Email: <input type="email" id="jq-email" placeholder="your@email.com"></p>
        <p><button id="registerBtn">Register</button></p>
    </div>

    <div id="jq-success-msg" style="display: none; background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 10px;"></div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>
    <p>
        <a href="../13_Debugging_Testing/index.html">← Previous: Debugging &amp; Testing</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
