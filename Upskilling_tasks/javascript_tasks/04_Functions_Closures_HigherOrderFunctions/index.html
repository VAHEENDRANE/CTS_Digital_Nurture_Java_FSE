<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 04 - Functions, Closures &amp; Higher-Order Functions</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 04 - Functions, Closures &amp; Higher-Order Functions</strong></p>
    <hr>

    <h2>Add New Event</h2>
    <p>
        Event Name: <input type="text" id="new-name" placeholder="e.g. Baking Workshop"><br><br>
        Date: <input type="date" id="new-date"><br><br>
        Category:
        <select id="new-category">
            <option value="music">Music</option>
            <option value="baking">Baking</option>
            <option value="wellness">Wellness</option>
            <option value="tech">Tech</option>
        </select><br><br>
        Capacity: <input type="number" id="new-capacity" placeholder="e.g. 20" min="1"><br><br>
        <button onclick="submitNewEvent()">Add Event</button>
    </p>

    <hr>

    <h2>Filter Events by Category</h2>
    <button class="filter-tab active" onclick="setCategoryFilter('all', this)">All</button>
    <button class="filter-tab" onclick="setCategoryFilter('music', this)">Music</button>
    <button class="filter-tab" onclick="setCategoryFilter('baking', this)">Baking</button>
    <button class="filter-tab" onclick="setCategoryFilter('wellness', this)">Wellness</button>
    <button class="filter-tab" onclick="setCategoryFilter('tech', this)">Tech</button>

    <br><br>
    <div id="event-dashboard"></div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>
    <p>
        <a href="../03_Conditionals_Loops_ErrorHandling/index.html">← Previous: Control Flow</a>
        &nbsp;&nbsp;
        <a href="../05_Objects_Prototypes/index.html">Next: Objects &amp; Prototypes →</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
