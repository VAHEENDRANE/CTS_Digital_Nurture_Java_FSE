<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 06 - Arrays &amp; Methods</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: white;
            color: #111;
        }
        input, select, button {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 4px 6px;
        }
        button {
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }
        table th {
            background-color: #eeeeee;
        }
    </style>
    
    <script>
        (function() {
            var originalLog = console.log;
            console.log = function() {
                originalLog.apply(console, arguments);
                var terminal = document.getElementById('terminal-logs');
                var msg = Array.prototype.slice.call(arguments).map(function(arg) {
                    return typeof arg === 'object' ? JSON.stringify(arg) : arg;
                }).join(' ');
                if (terminal) {
                    var line = document.createElement('div');
                    line.textContent = '> ' + msg;
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            };
        })();
    </script>
</head>
<body>

    <h1>Local Community Event Portal</h1>
    <p><strong>Exercise 06 - Array Methods: push, filter, map</strong></p>
    <hr>

    <h2>Add New Event (uses array.push)</h2>
    <p>
        Event Name: <input type="text" id="event-name-input" placeholder="Event Name"><br><br>
        Date: <input type="date" id="event-date-input"><br><br>
        Category:
        <select id="event-cat-input">
            <option value="Music">Music</option>
            <option value="Baking">Baking</option>
            <option value="Wellness">Wellness</option>
            <option value="Tech">Tech</option>
        </select><br><br>
        Seats: <input type="number" id="event-seats-input" placeholder="Seat Capacity" min="1"><br><br>
        <button onclick="submitNewEvent()">Push to Array</button>
    </p>

    <hr>

    <h2>Explore Events (uses array.filter)</h2>
    <button class="filter-tab active" onclick="changeCategoryFilter('All', this)">All</button>
    <button class="filter-tab" onclick="changeCategoryFilter('Music', this)">Music</button>
    <button class="filter-tab" onclick="changeCategoryFilter('Baking', this)">Baking</button>
    <button class="filter-tab" onclick="changeCategoryFilter('Wellness', this)">Wellness</button>
    <button class="filter-tab" onclick="changeCategoryFilter('Tech', this)">Tech</button>

    <br><br>
    <div id="events-container"></div>

    <hr>
    
    <h3>Console Output:</h3>
    <div id="terminal-logs" style="background-color: black; color: lime; font-family: monospace; font-size: 13px; padding: 10px; height: 120px; overflow-y: auto; border: 1px solid #333;"></div>


    <hr>
    <p>
        <a href="../05_Objects_Prototypes/index.html">← Previous: Objects</a>
        &nbsp;&nbsp;
        <a href="../07_DOM_Manipulation/index.html">Next: DOM Manipulation →</a>
    </p>

    <script src="main.js"></script>

</body>
</html>
